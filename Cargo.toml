[package]
name = "engram"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Shared verbatim chat memory for multi-model LLM pipelines. MCP + HTTP, SQLite FTS5-backed."
authors = ["Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>"]
homepage = "https://Engram.SpacecraftSoftware.org/"
repository = "https://github.com/Spacecraft-Software/engram"

[[bin]]
name = "engram"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
owo-colors = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rmcp = { version = "0.16", features = ["server", "transport-io", "macros"] }
schemars = "1.2.1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
