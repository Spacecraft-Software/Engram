[package]
name = "engram"
version = "0.6.0-dev"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Shared verbatim chat memory for multi-model LLM pipelines. MCP + HTTP, SQLite FTS5-backed."
authors = ["Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>"]
homepage = "https://Engram.SpacecraftSoftware.org/"
repository = "https://github.com/Spacecraft-Software/engram"

[[bin]]
name = "engram"
path = "src/main.rs"

[features]
# Default build stays FTS5-only: zero ML dependencies, identical behavior to
# 0.2.x. Vector/hybrid retrieval is strictly opt-in.
default = []
# Semantic (vector) search via Model2Vec static embeddings, loaded from a
# LOCAL model directory only (--model-path / ENGRAM_MODEL /
# $XDG_DATA_HOME/engram/model). model2vec-rs is pulled with
# default-features = false because its default feature set includes
# "hf-hub" (HuggingFace Hub fetching over the network via hf-hub + ureq),
# which would violate the Standard §9 privacy-first posture — engram never
# auto-downloads anything. "local-only" hard-disables remote loading inside
# model2vec-rs's from_pretrained; "fancy-regex" selects the pure-Rust
# tokenizer regex backend instead of the default "onig" (oniguruma C build).
vector = ["dep:model2vec-rs"]
# Reserved: a release build that vendors a model blob into the binary so
# `--features vector-bundled` needs no external model directory. No model
# blob is committed to this repository yet, so src/embed.rs carries a
# compile_error! stub for this feature — it exists in the manifest so the
# feature name is stable, but it cannot be built half-done. Build with
# `--features vector` and a local model path instead.
vector-bundled = ["vector"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
owo-colors = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rmcp = { version = "0.16", features = ["server", "transport-io", "macros"] }
schemars = "1.2.1"
# v4: random memory ids. v5: deterministic (namespaced-SHA1) fact ids —
# re-extraction regenerates the same id for the same (memory, fact) pair,
# which is what makes `consolidate --extract` idempotent via INSERT OR REPLACE.
uuid = { version = "1", features = ["v4", "v5"] }
anyhow = "1"
# Optional — gated behind the "vector" feature (see [features] for why the
# default features are disabled: no hf-hub network fetching, ever).
model2vec-rs = { version = "0.2", optional = true, default-features = false, features = [
    "local-only",
    "fancy-regex",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# tower/util + http-body-util drive `Router::oneshot` tests against the HTTP
# surface without binding a socket. axum 0.7 pins tower 0.4.
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
# pedantic / cargo / restriction groups deferred: CI denies warnings, and
# enabling them on this pre-existing codebase would gate M0 on a lint
# marathon rather than tests. Revisit at the M6 release pass.

[profile.release]
# lto + codegen-units=1 + panic=abort per Standard §3.2 (applied; none disabled).
lto = true
codegen-units = 1
panic = "abort"
