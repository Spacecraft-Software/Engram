[package]
name = "engram"
version = "0.3.0-dev"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Shared verbatim chat memory for multi-model LLM pipelines. MCP + HTTP, SQLite FTS5-backed."
authors = ["Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>"]
homepage = "https://Engram.SpacecraftSoftware.org/"
repository = "https://github.com/Spacecraft-Software/engram"

[[bin]]
name = "engram"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
owo-colors = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rmcp = { version = "0.16", features = ["server", "transport-io", "macros"] }
schemars = "1.2.1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# tower/util + http-body-util drive `Router::oneshot` tests against the HTTP
# surface without binding a socket. axum 0.7 pins tower 0.4.
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
# pedantic / cargo / restriction groups deferred: CI denies warnings, and
# enabling them on this pre-existing codebase would gate M0 on a lint
# marathon rather than tests. Revisit at the M6 release pass.

[profile.release]
# lto + codegen-units=1 + panic=abort per Standard §3.2 (applied; none disabled).
lto = true
codegen-units = 1
panic = "abort"
